<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101326">
<title>ロコ・ファイター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101326;color:#fff;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}
#game{display:block;width:100vw;height:100dvh;object-fit:contain;background:#101326}
#ui{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;text-shadow:0 2px 4px #000}
.panel{background:#101326cc;border:1px solid #ffffff55;border-radius:10px;padding:7px 10px;font-size:12px}
.health{height:12px;width:36vw;max-width:180px;background:#4a233c;border:2px solid #fff;border-radius:8px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:linear-gradient(90deg,#ffdf55,#ff684f);width:100%;transition:width .15s}
#hint{position:absolute;top:76px;left:0;right:0;text-align:center;font-size:12px;color:#fff;text-shadow:0 2px 4px #000;padding:0 16px}
.controls{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:end;justify-content:space-between;padding:0 20px}
#stick{width:124px;height:124px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff88;position:relative;pointer-events:auto}
#nub{position:absolute;width:52px;height:52px;left:34px;top:34px;border-radius:50%;background:#ffffff99;border:2px solid white;box-shadow:0 3px 8px #0008}
#attack{pointer-events:auto;width:94px;height:94px;border-radius:50%;border:3px solid #fff;background:linear-gradient(145deg,#ff9b48,#d72d54);font-size:16px;font-weight:1000;color:white;text-shadow:0 2px 3px #0008;box-shadow:0 5px 0 #741b36}
#attack:active{transform:scale(.96);box-shadow:0 2px 0 #741b36}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080b19cc;padding:24px;text-align:center}
.card{max-width:420px;background:linear-gradient(160deg,#262b4c,#111426);border:1px solid #ffffff55;border-radius:22px;padding:24px;box-shadow:0 16px 60px #0008}
h1{margin:0 0 8px;font-size:30px}p{line-height:1.55;color:#e4e7ff}
button.menu{border:0;border-radius:12px;background:#ffb34e;color:#271328;font-size:17px;font-weight:900;padding:13px 22px;touch-action:manipulation}
.small{font-size:12px;color:#c5c9e8}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
 <div class="top">
  <div class="panel"><div>LOCO</div><div class="health"><div id="lh" class="fill"></div></div></div>
  <div class="panel" style="text-align:center"><div id="stage">STAGE 1 / 8</div><div id="timer">99</div></div>
  <div class="panel" style="text-align:right"><div id="enemyname">FIGHTER</div><div class="health"><div id="eh" class="fill"></div></div></div>
 </div>
 <div id="hint">左スティックで移動・ジャンプ　攻撃ボタンで連続技</div>
 <div class="controls">
  <div id="stick"><div id="nub"></div></div>
  <button id="attack">攻撃!</button>
 </div>
</div>
<div id="overlay"><div class="card">
<h1>🐾 ロコ・ファイター</h1>
<p>実写のロコが8人の強敵に挑戦！<br>最後に待つのはウタちゃん。</p>
<p>左のスティックで移動。上方向でジャンプ。右の攻撃ボタンでパンチ・キック・噛みつき・必殺技を自動で繰り出すよ。</p>
<button class="menu" id="start">対戦スタート</button>
<p class="small">試作版：写真を使った簡易アニメーションとマルチタッチ操作のテスト用</p>
</div></div>

const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=390,H=844,dpr=1, running=false, stage=1, timer=99, last=0, elapsed=0;
let joy={x:0,y:0}, attackHeld=false, attackCooldown=0, attackCount=0, special=0, message='',messageT=0;

const names=['炎の空手家','音速の女拳士','鉄壁の力士','影の忍者','鋼鉄のレスラー','伝説の拳聖','闘技場の覇王','ウタちゃん'];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawPhotoCat(sx,sy,sw,sh,x,y,w,h,flip=false){
 if(!PHOTO.complete||!PHOTO.naturalWidth){rounded(x-w/2,y-h,w,h,22,'#e7d6bd');return}
 ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);
 // Clip the source photo to a rounded sprite window; slight bobbing gives a simple idle animation.
 ctx.beginPath();ctx.ellipse(0,-h*.48,w*.48,h*.5,0,0,Math.PI*2);ctx.clip();
 ctx.drawImage(PHOTO,sx,sy,sw,sh,-w/2,-h,w,h);
 ctx.restore();
}
function fighter(x,y,w,h,color,label,hit,flip){
 ctx.save();ctx.translate(x,y);
 if(hit>0){ctx.translate((Math.random()-.5)*7,0);ctx.rotate((Math.random()-.5)*.08)}
 rounded(-w*.32,-h*.68,w*.64,h*.6,22,color);
 ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,-h*.78,w*.34,h*.26,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-w*.13,-h*.8,w*.07,h*.07,0,0,Math.PI*2);ctx.ellipse(w*.13,-h*.8,w*.07,h*.07,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-w*.13,-h*.8,3,0,Math.PI*2);ctx.arc(w*.13,-h*.8,3,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(w*.2,-h*.55);ctx.lineTo(w*.4,-h*.48);ctx.stroke();
 ctx.restore();
}
function drawBackground(){
 let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#28234f');grad.addColorStop(.6,'#8b376f');grad.addColorStop(1,'#f6a45c');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
 // arena lights
 for(let i=0;i<7;i++){ctx.fillStyle=['#ff8bd6','#76ddff','#fff0a5'][i%3];ctx.globalAlpha=.45;ctx.beginPath();ctx.arc((i+.5)*W/7,H*.22+Math.sin(elapsed*1.2+i)*12,7+(i%3)*3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
 ctx.fillStyle='#1a1931';ctx.fillRect(0,H*.67,W,H*.33);
 ctx.strokeStyle='#ffcbef55';ctx.lineWidth=2;
 for(let i=0;i<9;i++){ctx.beginPath();ctx.moveTo(W/2,H*.67);ctx.lineTo(i*W/8,H);ctx.stroke()}
 for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(0,H*(.71+i*.07),W,H*(.71+i*.07));ctx.stroke()}
}
function showMessage(t){message=t;messageT=1.5}
function nextStage(){if(stage>=8){running=false;$('overlay').style.display='flex';$('overlay').querySelector('h1').textContent='🏆 チャンピオン！';$('overlay').querySelector('p').innerHTML='ロコがウタちゃんとの最終決戦を制した！<br>世界最強の猫ファイター誕生！';$('start').textContent='もう一度遊ぶ';return}
 stage++;player.hp=Math.min(100,player.hp+25);enemy.hp=100;enemy.x=.75;enemy.attackT=1.5;special=0;$('stage').textContent=`STAGE ${stage} / 8`; $('enemyname').textContent=names[stage-1];showMessage('STAGE '+stage+'  '+names[stage-1]);}
function start(){stage=1;timer=99;player={x:.24,y:0,vx:0,vy:0,hp:100,face:1,ground:true,hit:0,anim:0};enemy={x:.76,y:0,hp:100,face:-1,hit:0,attackT:1.5,anim:0};special=0;elapsed=0;running=true;$('overlay').style.display='none';$('stage').textContent='STAGE 1 / 8';$('enemyname').textContent=names[0];showMessage('FIGHT!');last=performance.now();requestAnimationFrame(loop)}
$('start').addEventListener('click',start);
function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.04);last=now;elapsed+=dt;timer-=dt;attackCooldown=Math.max(0,attackCooldown-dt);messageT=Math.max(0,messageT-dt);player.hit=Math.max(0,player.hit-dt);enemy.hit=Math.max(0,enemy.hit-dt);
 const floor=H*.78;
 // independent held inputs: joystick state and attack state are never mutually exclusive
 player.vx=joy.x*W*.48;player.x=Math.max(.08,Math.min(.92,player.x+player.vx*dt/W));player.face=enemy.x>=player.x?1:-1;
 if(joy.y<-.45&&player.ground){player.vy=-H*.78;player.ground=false}
 player.vy+=H*1.9*dt;player.y+=player.vy*dt;if(player.y>0){player.y=0;player.vy=0;player.ground=true}
 enemy.face=player.x>=enemy.x?1:-1;enemy.attackT-=dt;
 if(enemy.attackT<=0&&Math.abs(enemy.x-player.x)<.32){player.hp-=8;player.hit=.25;enemy.attackT=1.4+Math.random()*1.3;showMessage('敵の攻撃！')}
 else if(Math.abs(enemy.x-player.x)>.23){enemy.x+=Math.sign(player.x-enemy.x)*dt*.07}
 if(attackHeld&&attackCooldown<=0){
  attackCooldown=.34;attackCount++;let dist=Math.abs(enemy.x-player.x);
  if(dist<.32){let dmg=8+Math.random()*8;let move;
   if(special>=100){dmg=35;move='ロコちゃんスペシャル！';special=0;enemy.x=Math.max(.1,Math.min(.9,enemy.x+player.face*.12))}
   else {let moves=['猫パンチ！','キック！','ガブッ！','連続パンチ！'];move=moves[(attackCount-1)%moves.length];special=Math.min(100,special+13)}
   enemy.hp-=dmg;enemy.hit=.22;showMessage(move);enemy.x=Math.max(.08,Math.min(.92,enemy.x+player.face*.035));
  }else{showMessage('近づいて攻撃！');special=Math.min(100,special+3)}
 }
 if(player.hp<=0){player.hp=0;running=false;$('overlay').style.display='flex';$('overlay').querySelector('h1').textContent='😿 K.O.';$('overlay').querySelector('p').innerHTML='ロコ、惜しかった！<br>もう一度挑戦しよう。';$('start').textContent='リトライ'}
 if(enemy.hp<=0){enemy.hp=0;showMessage('K.O.!');nextStage()}
 $('lh').style.width=player.hp+'%';$('eh').style.width=enemy.hp+'%';$('timer').textContent=Math.max(0,Math.ceil(timer));
 drawBackground();
 const pw=Math.min(W*.34,140),ph=Math.min(H*.36,245),ex=player.x*W,ey=floor+player.y;

 let ew=Math.min(W*.32,132),eh=Math.min(H*.34,230),xx=enemy.x*W,yy=floor;

// Multi-touch joystick tracks its own pointer; attack button independently tracks another pointer.
const stick=$('stick'),nub=$('nub');let stickPointer=null,origin={x:0,y:0};
function updateStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,max=38,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}joy.x=dx/max;joy.y=dy/max;nub.style.transform=`translate(${dx}px,${dy}px)`}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);updateStick(e) });
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer){e.preventDefault();updateStick(e)}});
function releaseStick(e){if(e.pointerId===stickPointer){stickPointer=null;joy.x=0;joy.y=0;nub.style.transform='translate(0,0)'}}
stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);stick.addEventListener('lostpointercapture',releaseStick);
const attack=$('attack');let attackPointers=new Set();
attack.addEventListener('pointerdown',e=>{e.preventDefault();attackPointers.add(e.pointerId);attackHeld=true;attack.setPointerCapture(e.pointerId)});
function releaseAttack(e){attackPointers.delete(e.pointerId);attackHeld=attackPointers.size>0}
attack.addEventListener('pointerup',releaseAttack);attack.addEventListener('pointercancel',releaseAttack);attack.addEventListener('lostpointercapture',releaseAttack);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')joy.x=-1;if(e.key==='ArrowRight'||e.key==='d')joy.x=1;if(e.key==='ArrowUp'||e.key===' ')joy.y=-1;if(e.key==='z'||e.key==='Enter')attackHeld=true});
addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))joy.x=0;if(['ArrowUp',' '].includes(e.key))joy.y=0;if(e.key==='z'||e.key==='Enter')attackHeld=false});
